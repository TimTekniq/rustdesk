name: Build Tekniq Hulp

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  FLUTTER_BRIDGE_VERSION: '3.22.3'
  FLUTTER_RUST_BRIDGE_VERSION: '1.80.1'
  RUST_VERSION: '1.75'
  LLVM_VERSION: '15.0.6'
  VCPKG_COMMIT_ID: '120deac3062162151622ca4860575a33844ba10b'

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Cache Rust bridge tools
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: tekniq-hulp-bridge

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_BRIDGE_VERSION }}
          cache: true

      - name: Generate Flutter/Rust bridge
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version "${FLUTTER_RUST_BRIDGE_VERSION}" --features uuid --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Upload bridge
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
          if-no-files-found: error
          retention-days: 1

  validate-interface:
    needs: generate-bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore generated bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: .

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze Tekniq interface
        shell: bash
        run: |
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/common.dart \
            lib/desktop/pages/desktop_home_page.dart \
            lib/desktop/pages/server_page.dart
          popd

  build-windows:
    needs: [generate-bridge, validate-interface]
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore generated bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: .

      - name: Apply Tekniq branding
        shell: pwsh
        run: ./scripts/apply-tekniq-branding.ps1

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Install RustDesk Flutter engine
        shell: pwsh
        run: |
          flutter precache --windows
          Invoke-WebRequest `
            -Uri 'https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip' `
            -OutFile 'windows-x64-release.zip'
          Expand-Archive -Path 'windows-x64-release.zip' -DestinationPath 'windows-x64-release'
          $enginePath = Join-Path $env:FLUTTER_ROOT 'bin\cache\artifacts\engine\windows-x64-release'
          New-Item -ItemType Directory -Path $enginePath -Force | Out-Null
          Copy-Item -Path 'windows-x64-release\*' -Destination $enginePath -Recurse -Force

      - name: Apply RustDesk Flutter compatibility patch
        shell: bash
        run: |
          flutter_root="$(dirname "$(dirname "$(which flutter)")")"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$flutter_root/"
          cd "$flutter_root"
          if git apply --check flutter_3.24.4_dropdown_menu_enableFilter.diff; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          elif git apply --reverse --check flutter_3.24.4_dropdown_menu_enableFilter.diff; then
            echo "Flutter compatibility patch is already applied in the restored cache."
          else
            echo "Flutter compatibility patch does not match this Flutter checkout." >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: tekniq-hulp-windows

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install native dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build portable client
        shell: pwsh
        run: |
          python .\build.py --portable --flutter --hwcodec --vram
          Move-Item -LiteralPath '.\rustdesk-1.4.9-install.exe' -Destination '.\TekniqHulp.exe'

      - name: Record checksum and file metadata
        shell: pwsh
        run: |
          Get-FileHash -LiteralPath '.\TekniqHulp.exe' -Algorithm SHA256 | Format-List
          Get-Item -LiteralPath '.\TekniqHulp.exe' | Select-Object Name, Length, LastWriteTime | Format-List

      - name: Upload Tekniq Hulp
        uses: actions/upload-artifact@v4
        with:
          name: TekniqHulp-windows-x64
          path: TekniqHulp.exe
          if-no-files-found: error
          retention-days: 7
